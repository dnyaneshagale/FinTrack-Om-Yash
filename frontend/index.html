<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fintrack Om Yash</title>
    <style>
      html body #nl-badge,
      html body .nl-badge,
      html body button#nl-badge,
      html body [id="nl-badge"],
      html body [class*="nl-badge"],
      html body [aria-label*="Netlify"],
      html body [data-netlify-badge],
      iframe[src*="netlify"],
      #nl-badge,
      .nl-badge {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        clip: rect(0 0 0 0) !important;
        clip-path: inset(100%) !important;
        transform: scale(0) !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -99999 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const kill = () => {
          document.querySelectorAll('#nl-badge, .nl-badge, button[aria-label*="Netlify"], [class*="nl-badge"]').forEach(function(el) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('opacity', '0', 'important');
            el.remove();
          });
        };
        kill();
        setInterval(kill, 50);
        new MutationObserver(kill).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
