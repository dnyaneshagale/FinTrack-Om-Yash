server.port=${PORT:8080}
spring.application.name=fintrack-om-yash
management.endpoints.web.exposure.include=health,info
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure flag must be true in production (HTTPS). Defaults to false so local HTTP dev works without credentials errors.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.auth.father-password=${INITIAL_FATHER_PASSWORD:dev-father-change-me}
app.auth.son1-password=${INITIAL_SON1_PASSWORD:dev-son1-change-me}
app.auth.son2-password=${INITIAL_SON2_PASSWORD:dev-son2-change-me}
app.family.father-name=${FATHER_DISPLAY_NAME:Pappa}
app.family.son1-name=${SON1_DISPLAY_NAME:Om}
app.family.son2-name=${SON2_DISPLAY_NAME:Yash}
# Default to memory so local dev works without any Google credentials.
# Override via env var (STORAGE_MODE=sheets) or the backend/.env file for production.
app.storage.mode=${STORAGE_MODE:memory}
google.sheets.spreadsheet-id=${GOOGLE_SHEETS_SPREADSHEET_ID:}
google.service-account-json=${GOOGLE_SERVICE_ACCOUNT_JSON:}
# CORS allowed origins. SecurityConfig reads FRONTEND_ORIGIN env var directly (default already set there).
# For local dev both Vite ports are allowed by the SecurityConfig @Value default.
# In production set the FRONTEND_ORIGIN environment variable to your deployed frontend URL.