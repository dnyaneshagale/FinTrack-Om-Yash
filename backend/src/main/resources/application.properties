server.port=${PORT:8080}
spring.application.name=fintrack-om-yash
management.endpoints.web.exposure.include=health,info
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true

# Passwords
app.auth.father-password=${INITIAL_FATHER_PASSWORD}
app.auth.son1-password=${INITIAL_SON1_PASSWORD}
app.auth.son2-password=${INITIAL_SON2_PASSWORD}

# Family display names
app.family.father-name=${FATHER_DISPLAY_NAME}
app.family.son1-name=${SON1_DISPLAY_NAME}
app.family.son2-name=${SON2_DISPLAY_NAME}

# Storage mode: memory or sheets
app.storage.mode=${STORAGE_MODE}
google.sheets.spreadsheet-id=${GOOGLE_SHEETS_SPREADSHEET_ID}
google.service-account-json=${GOOGLE_SERVICE_ACCOUNT_JSON}
